function dueBadge(t){if(!t.deadline)return '';if(done(t))return '<span class="due complete">✓ 已完成</span>';let dl=new Date(t.deadline).getTime(),diff=dl-Date.now();if(!Number.isFinite(dl))return '';const display=t.deadline.replace('T',' ');if(diff<0)return `<span class="due overdue" title="${esc(display)}">⚠ 已逾期 · ${esc(display)}</span>`;if(diff<72*3600000)return `<span class="due urgent" title="${esc(display)}">⚠ 即将截止 · ${esc(display)}</span>`;return `<span class="due" title="${esc(display)}">截止 ${esc(display)}</span>`}
const check=t=>`<label class="check"><input type="checkbox" data-action="check" data-id="${esc(t.id)}" aria-label="${esc(t.title)}" ${done(t)?'checked':''}></label>`;
function taskMatrix(c,w){let list=tasks(c,w).filter(t=>!onlyIncomplete||!done(t));const all=tasks(c,w),label=lecturePlan(c,w).title;
 if(!all.length)return `<div class="emptyState">${cal(w)?.holiday?'假期周暂无任务 · 可在 Settings 添加任何学习任务':'这一周暂无任务 · 可在 Settings 配置 Lecture 和任务'}</div>`;
 if(!list.length)return `<div class="emptyState">✓ 这一周的任务已全部完成</div>`;
 return `<div class="tableWrap"><table class="taskTable"><thead><tr><th>Lecture / Week</th>${list.map(t=>`<th>${esc(t.title)}</th>`).join('')}</tr></thead><tbody><tr><td><div class="lectureTitle">${esc(label)}</div><div class="lectureSubtitle">${cal(w)?.holiday?'Vacation · Optional Tasks':'Week '+w} · ${all.length} 项任务</div></td>${list.map(t=>`<td><div class="taskcell">${check(t)}${dueBadge(t)}</div></td>`).join('')}</tr></tbody></table></div>`}
function moduleCard(c,w){let ts=tasks(c,w),st=stats(ts),closed=!!collapsed[c.id];return `<section class="moduleCard"><button class="moduleHeader" data-action="collapse" data-id="${esc(c.id)}"><div class="moduleHeadMain"><div class="moduleBadge" style="background:${c.color}1c;color:${c.color}">${esc(c.code.slice(0,2))}</div><div><div class="moduleTitle">${esc(c.code)} · ${esc(c.name)}</div><div class="moduleMeta">${esc(lecturePlan(c,w).title)} · ${st.all} Tasks</div></div></div><div class="headerRight"><div class="miniProgress">${progress(st.pct,st.pct===100&&st.all>0)}</div><span class="headerPct">${st.done}/${st.all}</span><span class="chevron">${closed?'⌄':'⌃'}</span></div></button>${closed?'':`<div class="moduleBody">${taskMatrix(c,w)}</div>`}</section>`}
function summary(ts,title){const s=stats(ts);return `<div class="summary"><div class="stat"><div class="statLabel">${esc(title)}</div><div class="statValue">${s.pct}%</div>${progress(s.pct,s.pct===100&&s.all>0)}<div class="statSub" style="margin-top:7px">${s.done} / ${s.all} tasks completed</div></div><div class="stat"><div class="statLabel">全部任务</div><div class="statValue">${s.all}</div><div class="statSub">Total tasks</div></div><div class="stat"><div class="statLabel">已完成</div><div class="statValue" style="color:var(--good)">${s.done}</div><div class="statSub">Completed</div></div><div class="stat"><div class="statLabel">待完成</div><div class="statValue">${s.left}</div><div class="statSub">Remaining</div></div></div>`}
function periodTabs(){return `<div class="periodTabs">${data().periods.map(p=>`<button class="periodBtn ${period===p.key?'active':''}" data-action="period" data-period="${p.key}">${esc(p.name)} <span class="num">${p.weeks}w</span></button>`).join('')}</div>`}
function yearStrip(){return `<div class="yearStrip"><div class="inline"><strong>Academic Year</strong><select data-action="yearChange" id="yearSelect">${Object.keys(S.years).sort().map(k=>`<option value="${k}" ${Y===k?'selected':''}>${yLabel(k)}</option>`).join('')}</select><span class="status ${cloudReady?'cloud':''}">${cloudReady?'☁ 云端已连接':esc(cloudStatus)}</span></div><div class="inline"><button class="btn tiny" data-action="today">今天</button><button class="btn tiny" data-action="newYear">＋ 添加学年</button></div></div>`}
function weekly(){let w=week,d=cal(w),ts=weekTasks(w);let weeks=periodWeeks(period);return `<div class="pagehead"><div><div class="eyebrow">Weekly Overview</div><h1 class="title">Weekly Dashboard</h1><p class="desc">全部课程集中打卡 · 点击上周/下周切换 · 进度自动保存</p></div></div><div class="weekBar"><button class="btn" data-action="prevWeek" ${w<=1?'disabled':''}>← 上一周</button><div class="weekMeta"><strong>Week ${w}</strong><span>${esc(d?.periodName)} · ${esc(datestr(d?.start))} – ${esc(datestr(d?.end))}${d?.holiday?' · 假期周':''}</span></div><button class="btn" data-action="nextWeek" ${w>=calendar().length?'disabled':''}>下一周 →</button></div><div class="weekNav">${weeks.map(x=>{const s=stats(weekTasks(x.week));return `<button class="weekBtn ${w===x.week?'selected':''} ${x.holiday?'holiday':''}" data-action="week" data-week="${x.week}">W${x.week}<small>${s.all?s.pct+'%':x.holiday?'Vacation':'—'}</small></button>`}).join('')}</div>${summary(ts,'本周总进度')}<div class="toolbar"><label class="toggle"><input type="checkbox" data-action="incomplete" ${onlyIncomplete?'checked':''}> 只显示未完成</label><div class="spacer"></div><button class="btn tiny" data-action="expandAll">全部展开</button><button class="btn tiny" data-action="collapseAll">全部折叠</button></div><div class="sectionStack">${activeCourses().length?activeCourses().map(c=>moduleCard(c,w)).join(''):'<div class="emptyState">当前阶段暂无课程。前往 Settings 勾选课程所属阶段（例如 Christmas Vacation / Summer Vacation），即可在此查看。</div>'}</div>`}
function moduleDash(){let c=activeCourses().find(x=>x.id===selectedModule)||activeCourses()[0];if(!c)return `<div class="pagehead"><h1 class="title">Module Dashboard</h1></div><div class="emptyState">当前阶段没有启用的课程。请在 Settings 选择要在 ${esc(perObj(period)?.name||period)} 显示的课程；已有数据不会被删除。</div>`;selectedModule=c.id;let ts=moduleTasks(c),weeks=periodWeeks(period);let periodTasks=weeks.flatMap(x=>tasks(c,x.week)),st=stats(ts),pw=stats(periodTasks);let finished=calendar().filter(x=>{let l=tasks(c,x.week);return l.length&&l.every(done)}).length;let ds=stats(tasks(c,detailWeek));const phaseNames=coursePeriods(c).map(k=>perObj(k)?.name).filter(Boolean).join(' · ');return `<div class="pagehead"><div><div class="eyebrow">Module Overview</div><h1 class="title">Module Dashboard</h1><p class="desc">整个 Module 的进度 + 各周完成情况 · 所属阶段：${esc(phaseNames)}</p></div><div class="actions"><button class="btn" data-action="configure" data-id="${esc(c.id)}">⚙ 配置课程</button></div></div><div class="modPick">${activeCourses().map(m=>`<button class="pickBtn ${c.id===m.id?'active':''}" data-action="module" data-id="${esc(m.id)}"><span class="dot" style="background:${m.color}"></span>${esc(m.code)} · ${esc(m.name)}</button>`).join('')}</div><div class="summary"><div class="stat"><div class="statLabel">Overall Module Progress</div><div class="statValue">${st.pct}%</div>${progress(st.pct,st.pct===100&&st.all>0)}<div class="statSub" style="margin-top:7px">所属阶段合计 ${st.done}/${st.all} tasks</div></div><div class="stat"><div class="statLabel">${esc(perObj(period)?.name)} Progress</div><div class="statValue">${pw.pct}%</div><div class="statSub">${pw.done}/${pw.all} tasks</div></div><div class="stat"><div class="statLabel">已完成周次</div><div class="statValue">${finished}</div><div class="statSub">仅统计有任务的周次</div></div><div class="stat"><div class="statLabel">剩余任务</div><div class="statValue">${st.left}</div><div class="statSub">Only enabled periods</div></div></div><div class="detailHead"><h2>${esc(perObj(period)?.name)} · Weekly Progress</h2><span class="pill">点击任意周查看详情</span></div><div class="weekGrid">${weeks.map(x=>{let s=stats(tasks(c,x.week));return `<button class="weekCard ${x.week===detailWeek?'selected':''} ${x.holiday?'holiday':''}" data-action="detailWeek" data-week="${x.week}"><span class="label">WEEK ${x.week} ${x.holiday?'☀':''}</span><div class="percent">${s.all?s.pct+'%':'—'}</div>${progress(s.pct,s.all&&s.pct===100)}<div class="count">${s.done}/${s.all} tasks</div></button>`}).join('')}</div><div class="detailHead"><h2>Week ${detailWeek} · ${esc(datestr(cal(detailWeek)?.start))} – ${esc(shortDate(cal(detailWeek)?.end))}</h2><span class="pill">${ds.done}/${ds.all} · ${ds.pct}%</span></div><section class="moduleCard"><div class="moduleBody" style="border-top:0">${taskMatrix(c,detailWeek)}</div></section>`}
function settings(){let c=getC(settingModule)||data().courses[0];if(c)settingModule=c.id;return `<div class="pagehead"><div><div class="eyebrow">Make it your own</div><h1 class="title">课程与模板设置</h1><p class="desc">编辑课程、Lecture 名称、假期、Quiz 周期、任务截止时间和云端同步</p></div></div><div class="settingsLayout"><div><div class="navCaption">所有课程</div>${data().courses.map(m=>`<button class="settingItem ${c?.id===m.id?'active':''}" data-action="settingModule" data-id="${esc(m.id)}"><span>${esc(m.code)} · ${esc(m.name)}</span> →</button>`).join('')}<button class="settingItem" data-action="addCourse">＋ 添加一门课程</button>${dataManagement()}</div><div>${c?config(c):'<div class="panel emptyState">请先添加一门课程。</div>'}</div></div>`}
function dataManagement(){return `<div class="panel" style="margin-top:18px"><h3 class="settingsTitle">学年与日历</h3><p class="help">假期周也计入全年周数；设置变动可能影响周号，请在录入任务前确认。</p><div class="field"><label>本学年 Week 1 日期</label><input id="yearStart" type="date" value="${esc(data().start)}"></div><div class="field" style="margin-top:9px"><label>各阶段周数</label>${data().periods.map(p=>`<div style="display:flex;align-items:center;gap:6px;margin:5px 0"><span style="font-size:11px;flex:1">${esc(p.name)}</span><input data-period-length="${p.key}" type="number" min="1" max="30" value="${p.weeks}" style="width:65px;padding:5px 7px"></div>`).join('')}</div><button class="btn tiny" data-action="saveCalendar" style="margin-top:10px">保存日历</button><div class="divider"></div><h3 class="settingsTitle">数据管理</h3><p class="help">浏览器存储仅为本地副本，建议先导出备份再连接云端。</p><div class="actions"><button class="btn tiny" data-action="export">↓ 导出 JSON</button><button class="btn tiny" data-action="import">↑ 导入 JSON</button></div><button class="btn tiny danger" data-action="reset" style="margin-top:10px">重置演示</button></div>${cloudPanel()}`}
function cloudPanel(){return `<div class="panel"><h3 class="settingsTitle">☁ 云端同步（Supabase）</h3><p class="help">需要先在自己的 Supabase 项目执行随附的 SQL，再填入 Project URL 和 publishable / anon key。<b>绝不能填写 service_role 或 secret key。</b></p><div class="field"><label>Project URL</label><input id="cloudUrl" placeholder="https://xxxx.supabase.co" value="${esc(cloudConfig?.url||'')}"></div><div class="field" style="margin-top:9px"><label>Publishable / anon Key</label><input id="cloudKey" type="password" placeholder="sb_publishable_... / eyJ..." value="${esc(cloudConfig?.key||'')}"></div><div class="actions" style="margin-top:10px"><button class="btn tiny" data-action="connectCloud">连接云项目</button></div><div class="divider"></div><div class="field"><label>登录邮箱（一次性链接）</label><input id="cloudEmail" type="email" placeholder="you@example.com"></div><div class="actions" style="margin-top:10px"><button class="btn tiny" data-action="otp">发送登录邮件</button><button class="btn tiny" data-action="cloudSignOut">退出登录</button></div><div class="help" style="margin-top:9px">${cloudUser?'已登录 '+esc(cloudUser.email||'账户'):'暂未登录'} · ${esc(cloudStatus)}</div><div class="actions" style="margin-top:10px"><button class="btn tiny" data-action="cloudUpload" ${!cloudUser?'disabled':''}>↑ 本地上传到云端</button><button class="btn tiny" data-action="cloudDownload" ${!cloudUser?'disabled':''}>↓ 从云端读取</button></div><p class="help">首次请手动选择一次上传或下载，之后自动同步。不同设备同时修改采用最后写入覆盖，建议保留 JSON 备份。</p></div>`}
function config(c){const current=cal(settingWeek)?settingWeek:1;return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><h3 class="settingsTitle">${esc(c.code)} · ${esc(c.name)}</h3><p class="help">本页面是新增/修改任务的唯一入口；Dashboard 专注于打卡。</p></div><button class="btn tiny danger" data-action="deleteCourse" data-id="${esc(c.id)}">删除课程</button></div><div class="divider"></div><div class="formGrid"><div class="field"><label>课程代码</label><input id="courseCode" value="${esc(c.code)}" maxlength="30"></div><div class="field"><label>课程名称</label><input id="courseName" value="${esc(c.name)}" maxlength="90"></div><div class="field"><label>主题颜色</label><select id="courseColor">${COLORS.map(x=>`<option value="${x}" ${x===c.color?'selected':''}>${x}</option>`).join('')}</select></div><div class="field wide"><label>每周 Lecture 的默认任务类型（每行一个）</label><textarea id="taskTypes" rows="4">${esc(c.taskTypes.map(t=>t.title).join('\n'))}</textarea><p class="help">默认每周只有一堂 Lecture；你可以为不同周分别命名、停用或恢复。</p></div></div><div class="field" style="margin-top:17px"><label>课程所属阶段（可多选）</label><p class="help">仅在勾选的学期或假期中显示该课程；Overall Module Progress 汇总这些阶段的任务。取消勾选不会删除此前打卡记录，重新勾选可恢复。</p><div class="periodSelector">${data().periods.map(p=>`<label class="phaseCheck"><input type="checkbox" data-course-period="${p.key}" ${courseInPeriod(c,p.key)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-action="saveCourse" data-id="${esc(c.id)}">保存课程设置</button></div><div class="divider"></div><h3 class="settingsTitle">各周 Lecture 名称与放假安排</h3><p class="help">默认教学周有 Lecture，假期周不安排任务。勾选“有课”即可在假期补课；取消勾选则该周仅保留 Quiz / 自定义任务。</p><div class="weekPlan">${calendar().map(d=>{const p=lecturePlan(c,d.week);return `<div class="planRow ${d.holiday?'holiday':''}"><div class="when"><b>Week ${d.week}</b><div>${esc(shortDate(d.start))}</div><div>${d.holiday?'☀ 假期':esc(d.periodName)}</div></div><div class="name"><input type="text" maxlength="120" placeholder="Lecture 名称" data-plan-name="${d.week}" value="${esc(p.title)}"></div><label style="white-space:nowrap;font-size:11px;color:#77889f"><input type="checkbox" data-plan-enabled="${d.week}" ${p.enabled?'checked':''}> 有课</label></div>`}).join('')}</div><button class="btn" data-action="savePlans" data-id="${esc(c.id)}" style="margin-top:13px">保存周次 / Lecture 名称</button><div class="divider"></div><h3 class="settingsTitle">Quiz / Workshop 等周期任务</h3><p class="help">在此设置任务何时出现和默认截止星期/时间。Dashboard 内与 PPT 等普通任务显示在同一行。</p>${c.rules.map(r=>`<div class="ruleItem"><div><div class="ruleTitle">${esc(r.title)}</div><div class="ruleMeta">${r.frequency==='weekly'?'每周':r.frequency==='biweekly'?'每两周':'指定周次'} · ${esc((r.periods||[]).map(k=>perObj(k)?.name).filter(Boolean).join(' / '))} ${r.day===''?'· 不设默认期限':`· 默认周${['一','二','三','四','五','六','日'][Number(r.day??4)]} ${esc(r.time||'23:59')}`}</div></div><div class="actions"><button class="btn tiny" data-action="editRule" data-id="${esc(r.id)}" data-module="${esc(c.id)}">编辑</button><button class="btn tiny danger" data-action="deleteRule" data-id="${esc(r.id)}" data-module="${esc(c.id)}">删除</button></div></div>`).join('')||'<div class="help">尚无重复规则</div>'}<button class="btn" data-action="addRule" data-module="${esc(c.id)}" style="margin-top:12px">＋ 新增周期任务</button><div class="divider"></div><h3 class="settingsTitle">指定周次的任务与 Deadline</h3><p class="help">不论是否假期，都可以选择该周并添加任务。日期和时间支持单独修改。</p><div class="field"><label>编辑哪一周</label><select id="configWeek" data-action="settingWeek">${calendar().map(d=>`<option value="${d.week}" ${settingWeek===d.week?'selected':''}>Week ${d.week} · ${shortDate(d.start)} – ${shortDate(d.end)} · ${esc(d.periodName)}</option>`).join('')}</select></div><div class="taskSettings" style="margin-top:15px">${tasks(c,current).map(t=>`<div class="taskSettingsRow"><div><label>${esc(t.title)}</label><div class="id">${esc(t.kind==='custom'?'单次任务':t.kind==='rule'?'周期任务':'Lecture 默认任务')}</div></div><input type="datetime-local" data-deadline="${esc(t.id)}" value="${esc(t.deadline||'')}"><div class="actions">${t.kind==='custom'?`<button class="btn tiny" data-action="editTask" data-id="${esc(t.id)}">编辑</button>`:''}<button class="btn tiny danger" data-action="removeTask" data-id="${esc(t.id)}" data-module="${esc(c.id)}">移除</button></div></div>`).join('')||'<p class="help">该周无任务，可以直接新增。</p>'}</div><div class="actions" style="margin-top:13px"><button class="btn primary" data-action="addTask" data-module="${esc(c.id)}" data-week="${current}">＋ 添加该周任务</button><button class="btn" data-action="saveDeadlines" data-id="${esc(c.id)}">保存截止日期</button></div></div>`}
function modalHTML(){if(!modal)return '';if(modal.type==='course')return `<div class="overlay" data-action="overlay"><div class="dialog"><div class="dialogHead"><h3>添加一门课程</h3><button class="modalClose" data-action="close">×</button></div><p class="dialogIntro">创建后在 Settings 编辑课程每周任务、Lecture 名称和 Quiz。</p><div class="formGrid"><div class="field"><label>课程代码</label><input id="newCode" placeholder="EC226"></div><div class="field"><label>课程名称</label><input id="newName" placeholder="Econometrics"></div></div><div class="dialogActions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="saveNewCourse">创建课程</button></div></div></div>`;
if(modal.type==='task'){let t=data().customTasks.find(t=>t.id===modal.id),c=getC(modal.module)||data().courses[0];return `<div class="overlay" data-action="overlay"><div class="dialog"><div class="dialogHead"><h3>${t?'编辑任务':'新增单次任务'}</h3><button class="modalClose" data-action="close">×</button></div><p class="dialogIntro">此任务将与 Lecture、Quiz 任务显示在同一个表格里。</p><div class="formGrid"><div class="field wide"><label>任务名称</label><input id="taskName" value="${esc(t?.title||'')}" placeholder="例如 Summer Reading"></div><div class="field"><label>课程</label><select id="taskModule">${data().courses.map(x=>`<option value="${esc(x.id)}" ${(t?.courseId||c?.id)===x.id?'selected':''}>${esc(x.code)} · ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>周次</label><select id="taskWeek">${calendar().map(d=>`<option value="${d.week}" ${(t?.week||modal.week)===d.week?'selected':''}>Week ${d.week} · ${esc(shortDate(d.start))}</option>`).join('')}</select></div><div class="field wide"><label>Deadline（可选）</label><input type="datetime-local" id="taskDeadline" value="${esc(t?.deadline||'')}"></div></div><div class="dialogActions">${t?`<button class="btn danger" style="margin-right:auto" data-action="deleteTask" data-id="${esc(t.id)}">删除任务</button>`:''}<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="saveTask">保存</button></div></div></div>`}
if(modal.type==='rule'){let c=getC(modal.module),r=c?.rules.find(r=>r.id===modal.id);let periods=r?.periods||['s1','s2','s3'];return `<div class="overlay" data-action="overlay"><div class="dialog"><div class="dialogHead"><h3>${r?'修改周期任务':'新增周期任务'}</h3><button class="modalClose" data-action="close">×</button></div><p class="dialogIntro">设置 Quiz / Workshop 出现的周次以及每次默认截止日期时间。</p><div class="formGrid"><div class="field wide"><label>任务名称</label><input id="ruleName" value="${esc(r?.title||'Quiz')}"></div><div class="field"><label>重复频率</label><select id="ruleFrequency">${[['weekly','每周'],['biweekly','隔周'],['selected','指定全年 Week']].map(([k,label])=>`<option value="${k}" ${(r?.frequency||'biweekly')===k?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label>起始教学周（每个阶段）</label><input id="ruleStart" type="number" min="1" max="30" value="${Number(r?.start||1)}"></div><div class="field wide"><label>生效阶段（可多选）</label><div style="display:flex;flex-wrap:wrap;gap:9px">${data().periods.map(p=>`<label style="font-weight:normal;font-size:11px"><input type="checkbox" data-rule-period="${p.key}" ${periods.includes(p.key)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div><div class="field wide"><label>指定周次（只在“指定全年 Week”模式下使用，例如 3, 16, 33）</label><input id="ruleWeeks" value="${esc((r?.weeks||[]).join(', '))}" placeholder="3,16,33"></div><div class="field"><label>默认截止星期</label><select id="ruleDay"><option value="" ${r?.day===''?'selected':''}>不设默认期限</option>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day,i)=>`<option value="${i}" ${String(r?.day??4)===String(i)?'selected':''}>${day}</option>`).join('')}</select></div><div class="field"><label>默认截止时间</label><input type="time" id="ruleTime" value="${esc(r?.time||'23:59')}"></div></div><div class="dialogActions"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="saveRule">保存规则</button></div></div></div>`}
return ''}
function render(){const y=data();if(!y)return;const c=getC(selectedModule);if(!c)selectedModule=y.courses[0]?.id||'';if(!getC(settingModule))settingModule=y.courses[0]?.id||'';if(V==='modules'&&!activeCourses().some(x=>x.id===selectedModule))selectedModule=activeCourses()[0]?.id||'';app.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandIcon">▦</div><div><div class="brandTitle">Study Tracker</div><div class="small">Academic workspace · V2.2</div></div></div><div class="navGroup"><div class="navCaption">Workspace</div><button class="navBtn ${V==='weekly'?'active':''}" data-action="nav" data-view="weekly"><span class="navIcon">▦</span>Weekly Dashboard</button><button class="navBtn ${V==='modules'?'active':''}" data-action="nav" data-view="modules"><span class="navIcon">▤</span>Module Dashboard</button></div><div class="sideModules"><div class="navCaption">Your Modules</div><div class="navGroup">${activeCourses().map(c=>`<button class="courseLink ${V==='modules'&&selectedModule===c.id?'active':''}" data-action="module" data-id="${esc(c.id)}"><span class="dot" style="background:${c.color}"></span>${esc(c.code)} · ${esc(c.name)}</button>`).join('')}</div></div><div class="sideFoot"><button class="navBtn ${V==='settings'?'active':''}" data-action="nav" data-view="settings"><span class="navIcon">⚙</span>Settings · 自定义</button><p class="small" style="padding:0 12px">${esc(cloudReady?'☁ 云端自动同步已启动':'本地保存 · 可连接云端')}</p></div></aside><main class="main"><header class="academicNav" aria-label="Academic year and term navigation">${yearStrip()}${periodTabs()}</header>${V==='weekly'?weekly():V==='modules'?moduleDash():settings()}</main></div>${modalHTML()}`}
function toast(message){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),3300)}
function save(){S.lastYear=Y;S.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S));cloudStatus=cloudReady?'等待云端同步…':'本地已保存'}catch(err){toast('本地保存失败，请导出 JSON 备份')}if(cloudReady){clearTimeout(cloudTimer);cloudTimer=setTimeout(uploadCloud,850)}}
function switchWeek(w){week=Math.max(1,Math.min(calendar().length,w));toPeriod(week);if(!activeCourses().some(c=>c.id===selectedModule))selectedModule=activeCourses()[0]?.id||'';render()}
function switchYear(k){if(!S.years[k])return;Y=k;S.lastYear=k;week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=activeCourses()[0]?.id||'';settingModule=selectedModule;collapsed={};save();render()}
function choosePeriod(key){if(!perObj(key))return;period=key;if(!activeCourses().some(c=>c.id===selectedModule))selectedModule=activeCourses()[0]?.id||'';let found=periodWeeks(key);if(found.length){week=found[0].week;detailWeek=week;settingWeek=week}render()}
function get(id){return document.getElementById(id)}const val=id=>get(id)?.value||'';
function num(v,lo,hi){let n=Number(v);return Number.isFinite(n)?Math.min(hi,Math.max(lo,Math.floor(n))):lo}
function saveCourse(id){let c=getC(id);if(!c)return;let code=val('courseCode').trim(),name=val('courseName').trim();if(!code||!name){toast('请填写课程代码和名称');return}let phases=[...document.querySelectorAll('[data-course-period]:checked')].map(el=>el.dataset.coursePeriod);if(!phases.length){toast('请至少勾选一个课程所属阶段');return}c.activePeriods=phases;c.code=code;c.name=name;c.color=val('courseColor')||COLORS[0];let names=val('taskTypes').split('\n').map(x=>x.trim()).filter(Boolean);let used=new Set();c.taskTypes=names.map(title=>{const existing=c.taskTypes.find(t=>t.title===title&&!used.has(t.id));if(existing){used.add(existing.id);return existing}return {id:uid(),title}});save();render();toast('课程模板已保存')}
function savePlans(id){const c=getC(id);if(!c)return;for(const d of calendar()){const title=document.querySelector(`[data-plan-name="${d.week}"]`)?.value.trim()||`Lecture · Week ${d.week}`;const enabled=!!document.querySelector(`[data-plan-enabled="${d.week}"]`)?.checked;c.weekPlans[d.week]={title,enabled}}save();render();toast('Lecture 名称和假期安排已保存')}
function saveDeadlines(){for(const input of document.querySelectorAll('[data-deadline]'))data().deadlines[input.dataset.deadline]=input.value||'';save();render();toast('截止时间已保存')}
function saveRule(){const c=getC(modal.module);if(!c)return;let title=val('ruleName').trim();if(!title){toast('请填写任务名');return}let periods=[...document.querySelectorAll('[data-rule-period]:checked')].map(x=>x.dataset.rulePeriod);if(!periods.length){toast('至少选择一个阶段');return}let weeks=val('ruleWeeks').split(/[,，\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0&&n<=calendar().length);let r=c.rules.find(x=>x.id===modal.id);const fields={title,frequency:val('ruleFrequency'),periods,start:num(val('ruleStart'),1,30),weeks,day:val('ruleDay'),time:val('ruleTime')||'23:59'};if(r)Object.assign(r,fields);else c.rules.push({...fields,id:uid()});modal=null;save();render();toast('周期任务已更新')}
function saveTask(){let title=val('taskName').trim();if(!title){toast('任务名不能为空');return}let t=data().customTasks.find(x=>x.id===modal.id),cid=val('taskModule'),w=num(val('taskWeek'),1,calendar().length),deadline=val('taskDeadline');if(!courseInPeriod(getC(cid),cal(w)?.period)){toast('这门课程尚未启用该周所属阶段，请先到课程设置中勾选该阶段');return}if(!t){t={id:uid(),courseId:cid,week:w,title,deadline,lecture:0};data().customTasks.push(t)}else{Object.assign(t,{courseId:cid,week:w,title,deadline,lecture:0})}data().deadlines[t.id]=deadline;settingWeek=w;modal=null;save();render();toast('任务已保存')}
function downloadJSON(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`study-tracker-${Y}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function validateImport(x){if(x?.version===1&&Array.isArray(x.courses))return migrate(x);if(x?.version!==2||!x.years||typeof x.years!=='object')throw Error('无效的备份');for(const y of Object.values(x.years)){if(!Array.isArray(y.courses)||!Array.isArray(y.periods)||!Array.isArray(y.customTasks)||typeof y.completed!=='object')throw Error('无效学年数据');if(y.periods.reduce((s,p)=>s+Number(p.weeks),0)>104)throw Error('周数过多')}return x}
function addNewYear(){let latest=Object.keys(S.years).sort().at(-1);let startYear=Number(latest.slice(0,4))+1;let key=`${startYear}-${String(startYear+1).slice(-2)}`;while(S.years[key]){startYear++;key=`${startYear}-${String(startYear+1).slice(-2)}`}let from=S.years[latest];let start=addDays(from.start,from.periods.reduce((s,p)=>s+Number(p.weeks),0)*7);S.years[key]=yearMake(start);switchYear(key);V='settings';render();toast(`已创建 Academic Year ${yLabel(key)}，请设置课程`)}
// Cloud sync is opt-in; signing in by itself never overwrites either dataset.
async function sdk(){if(window.supabase?.createClient)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=()=>reject(Error('无法加载 Supabase SDK，请检查网络'));document.head.append(s)})}
async function connectCloud(){try{const url=val('cloudUrl').trim(),key=val('cloudKey').trim();if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(url)||!key||/service_role|sb_secret_/i.test(key))throw Error('需要正确的 Supabase URL 和 publishable/anon key，不能使用 secret key');cloudConfig={url:url.replace(/\/$/,''),key};localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudConfig));await sdk();cloud=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{user},error}=await cloud.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')throw error;cloudUser=user||null;cloudReady=false;cloudStatus=cloudUser?'已登录；请选择第一次上传或下载':'已连接云项目；请先用邮箱登录';cloud.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(!cloudUser)cloudReady=false;cloudStatus=cloudUser?'已登录；请选择同步方向':'尚未登录';render()});render();toast('云项目已连接')}catch(err){cloudStatus='云端连接失败';toast(err.message||'连接失败');render()}}
async function otp(){try{if(!cloud)await connectCloud();if(!cloud)throw Error('请先连接云项目');if(location.protocol==='file:')throw Error('邮件登录需要先把网站部署为 HTTPS 地址；本地文件模式不能完成回跳登录');const email=val('cloudEmail').trim();if(!/^\S+@\S+\.\S+$/.test(email))throw Error('请填写有效邮箱');const {error}=await cloud.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;toast('登录邮件已发送，请检查收件箱')}catch(e){toast(e.message)}}
async function uploadCloud(){if(!cloud||!cloudUser)return;try{const {error}=await cloud.from('user_state').upsert({user_id:cloudUser.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;cloudReady=true;localStorage.setItem(CLOUD_LINK_KEY,cloudUser.id);cloudStatus='云端已同步';document.querySelector('.status')&&(document.querySelector('.status').textContent='☁ 云端已同步')}catch(e){cloudReady=false;cloudStatus='云端保存失败';toast(`云端同步失败：${e.message}`);render()}}
async function downloadCloud(){if(!cloud||!cloudUser){toast('请先登录云端');return}try{const {data:row,error}=await cloud.from('user_state').select('data').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(!row){toast('云端暂无备份，可选择“本地上传到云端”');return}if(!confirm('将用云端数据替换本地所有学年和进度，建议先导出备份。继续吗？'))return;S=validateImport(row.data);Y=S.lastYear||Object.keys(S.years)[0];week=nowWeek();toPeriod(week);detailWeek=week;settingWeek=week;selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;cloudReady=true;localStorage.setItem(CLOUD_LINK_KEY,cloudUser.id);save();render();toast('已从云端恢复，后续将自动同步')}catch(e){cloudStatus='云端读取失败';toast(e.message);render()}}
async function resumeCloud(){if(!cloud||!cloudUser||localStorage.getItem(CLOUD_LINK_KEY)!==cloudUser.id)return;try{const {data:row,error}=await cloud.from('user_state').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(row&&new Date(row.updated_at).getTime()>new Date(S.updatedAt||0).getTime()+1000){S=validateImport(row.data);Y=S.lastYear&&S.years[S.lastYear]?S.lastYear:Object.keys(S.years)[0];week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;localStorage.setItem(KEY,JSON.stringify(S));cloudReady=true;cloudStatus='云端已同步';render()}else{cloudReady=true;await uploadCloud();render()}}catch(err){cloudReady=false;cloudStatus='云端恢复失败，可手动重试';render()}}
async function signOut(){if(cloud)await cloud.auth.signOut();cloudUser=null;cloudReady=false;cloudStatus='已退出云端';render()}
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-action="check"]')){data().completed[el.dataset.id]=el.checked;save();let position=window.scrollY;render();window.scrollTo(0,position);return}if(el.matches('[data-action="incomplete"]')){onlyIncomplete=el.checked;render();return}if(el.matches('[data-action="yearChange"]')){switchYear(el.value);return}if(el.matches('[data-action="settingWeek"]')){settingWeek=num(el.value,1,calendar().length);render();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.matches('input,select'))return;const a=el.dataset.action,id=el.dataset.id,cid=el.dataset.module;if(a==='overlay'&&e.target!==el)return;
switch(a){case'nav':V=el.dataset.view;render();break;case'module':selectedModule=id;V='modules';render();break;case'period':choosePeriod(el.dataset.period);break;case'week':switchWeek(Number(el.dataset.week));break;case'prevWeek':switchWeek(week-1);break;case'nextWeek':switchWeek(week+1);break;case'today':switchWeek(nowWeek());break;case'newYear':addNewYear();break;case'collapse':collapsed[id]=!collapsed[id];render();break;case'expandAll':collapsed={};render();break;case'collapseAll':data().courses.forEach(c=>collapsed[c.id]=true);render();break;case'detailWeek':detailWeek=Number(el.dataset.week);toPeriod(detailWeek);render();break;case'configure':settingModule=id;settingWeek=detailWeek;V='settings';render();break;case'settingModule':settingModule=id;render();break;
case'addCourse':modal={type:'course'};render();get('newCode')?.focus();break;
case'saveNewCourse':{const code=val('newCode').trim(),name=val('newName').trim();if(!code||!name){toast('请填写课程代码与名称');break}let c=courseMake(code,name,COLORS[data().courses.length%COLORS.length],['PPT','Pre-class Questions','In-class Questions'],[],[period]);data().courses.push(c);settingModule=c.id;selectedModule=c.id;modal=null;save();render();toast('新课程已创建');break}
case'deleteCourse':{let c=getC(id);if(c&&confirm(`确定删除 ${c.code} ${c.name}？这会移除全部相关打卡记录。`)){data().courses=data().courses.filter(x=>x.id!==id);data().customTasks=data().customTasks.filter(t=>t.courseId!==id);for(let k of Object.keys(data().completed))if(k.includes(':'+id+':'))delete data().completed[k];settingModule=data().courses[0]?.id||'';selectedModule=settingModule;save();render()}break}
case'saveCourse':saveCourse(id);break;case'savePlans':savePlans(id);break;case'saveDeadlines':saveDeadlines();break;
case'addTask':modal={type:'task',module:cid||settingModule,week:Number(el.dataset.week||settingWeek)};render();get('taskName')?.focus();break;
case'editTask':modal={type:'task',id};render();break;case'saveTask':saveTask();break;
case'deleteTask':if(confirm('确定删除这一项任务？')){data().customTasks=data().customTasks.filter(t=>t.id!==id);delete data().completed[id];delete data().deadlines[id];modal=null;save();render();toast('任务已删除')}break;
case'removeTask':{let c=getC(cid),t=tasks(c,settingWeek).find(t=>t.id===id);if(!t)break;if(!confirm(`从本周移除「${t.title}」？不会影响其他周。`))break;if(t.kind==='custom')data().customTasks=data().customTasks.filter(x=>x.id!==id);else data().suppressed[id]=true;delete data().completed[id];delete data().deadlines[id];save();render();break}
case'addRule':modal={type:'rule',module:cid};render();break;case'editRule':modal={type:'rule',module:cid,id};render();break;case'saveRule':saveRule();break;
case'deleteRule':if(confirm('删除周期规则后，各周对应的任务都会消失。确定吗？')){let c=getC(cid);c.rules=c.rules.filter(r=>r.id!==id);save();render()}break;
case'saveCalendar':{let start=val('yearStart');if(!/^\d{4}-\d{2}-\d{2}$/.test(start)){toast('起始日期无效');break}let lengths=[...document.querySelectorAll('[data-period-length]')];let newLen=lengths.reduce((n,x)=>n+num(x.value,1,30),0);if(newLen>104){toast('全年周数不能超过 104');break}if((start!==data().start||lengths.some(x=>num(x.value,1,30)!==perObj(x.dataset.periodLength).weeks))&&!confirm('更改起始日期或各阶段长度会调整周次日期，已有任务仍按原周号保存。确定吗？'))break;data().start=start;lengths.forEach(x=>perObj(x.dataset.periodLength).weeks=num(x.value,1,30));week=Math.min(week,calendar().length);detailWeek=Math.min(detailWeek,calendar().length);settingWeek=Math.min(settingWeek,calendar().length);toPeriod(week);save();render();toast('学年日历已更新');break}
case'export':downloadJSON();break;case'import':get('importInput').click();break;
case'reset':if(confirm('重置会清空当前浏览器的课程与打卡数据。建议先导出 JSON，确定继续吗？')){S=fresh();Y='2026-27';week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);settingModule='';selectedModule='';cloudReady=false;save();render();toast('演示数据已重置')}break;
case'close':case'overlay':modal=null;render();break;
case'connectCloud':await connectCloud();break;case'otp':await otp();break;case'cloudUpload':if(confirm('上传会覆盖同账户云端保存的全部学年数据。确定上传本机数据吗？')){await uploadCloud();render()}break;case'cloudDownload':await downloadCloud();break;case'cloudSignOut':await signOut();break;
}});
get('importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{let obj=validateImport(JSON.parse(await f.text()));if(confirm('导入将替换所有本地课程和打卡数据。建议先导出本地备份。继续吗？')){S=obj;Y=S.lastYear&&S.years[S.lastYear]?S.lastYear:Object.keys(S.years)[0];week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;save();render();toast('备份导入成功')}}catch(err){toast('导入失败：'+err.message)}e.target.value=''});
try{cloudConfig=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null')}catch(_){}
week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;
localStorage.setItem(KEY,JSON.stringify(S));
render();
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
if(cloudConfig){(async()=>{try{await sdk();cloud=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{user}}=await cloud.auth.getUser();cloudUser=user||null;cloudStatus=cloudUser?'云端已登录，请先选择上传或下载':'云项目已配置，尚未登录';cloud.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(!cloudUser)cloudReady=false;render()});render();if(cloudUser)await resumeCloud()}catch(e){cloudStatus='云端尚未连接';render()}})()}
})();
