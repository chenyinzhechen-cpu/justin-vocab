function toast(message){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),3300)}
function save(){S.lastYear=Y;S.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S));cloudStatus=cloudReady?'等待云端同步…':'本地已保存'}catch(err){toast('本地保存失败，请导出 JSON 备份')}if(cloudReady){clearTimeout(cloudTimer);cloudTimer=setTimeout(uploadCloud,850)}}
function switchWeek(w){week=Math.max(1,Math.min(calendar().length,w));toPeriod(week);if(!activeCourses().some(c=>c.id===selectedModule))selectedModule=activeCourses()[0]?.id||'';render()}
function switchYear(k){if(!S.years[k])return;Y=k;S.lastYear=k;week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=activeCourses()[0]?.id||'';settingModule=selectedModule;collapsed={};save();render()}
function choosePeriod(key){if(!perObj(key))return;period=key;if(!activeCourses().some(c=>c.id===selectedModule))selectedModule=activeCourses()[0]?.id||'';let found=periodWeeks(key);if(found.length){week=found[0].week;detailWeek=week;settingWeek=week}render()}
function get(id){return document.getElementById(id)}const val=id=>get(id)?.value||'';
function num(v,lo,hi){let n=Number(v);return Number.isFinite(n)?Math.min(hi,Math.max(lo,Math.floor(n))):lo}
function saveCourse(id){let c=getC(id);if(!c)return;let code=val('courseCode').trim(),name=val('courseName').trim();if(!code||!name){toast('请填写课程代码和名称');return}let phases=[...document.querySelectorAll('[data-course-period]:checked')].map(el=>el.dataset.coursePeriod);if(!phases.length){toast('请至少勾选一个课程所属阶段');return}c.activePeriods=phases;c.code=code;c.name=name;c.color=val('courseColor')||COLORS[0];let names=val('taskTypes').split('\n').map(x=>x.trim()).filter(Boolean);let used=new Set();c.taskTypes=names.map(title=>{const existing=c.taskTypes.find(t=>t.title===title&&!used.has(t.id));if(existing){used.add(existing.id);return existing}return {id:uid(),title}});save();render();toast('课程模板已保存')}
function savePlans(id){const c=getC(id);if(!c)return;for(const d of calendar()){const title=document.querySelector(`[data-plan-name="${d.week}"]`)?.value.trim()||`Lecture · Week ${d.week}`;const enabled=!!document.querySelector(`[data-plan-enabled="${d.week}"]`)?.checked;c.weekPlans[d.week]={title,enabled}}save();render();toast('Lecture 名称和假期安排已保存')}
function saveDeadlines(){for(const input of document.querySelectorAll('[data-deadline]'))data().deadlines[input.dataset.deadline]=input.value||'';save();render();toast('截止时间已保存')}
function saveRule(){const c=getC(modal.module);if(!c)return;let title=val('ruleName').trim();if(!title){toast('请填写任务名');return}let periods=[...document.querySelectorAll('[data-rule-period]:checked')].map(x=>x.dataset.rulePeriod);if(!periods.length){toast('至少选择一个阶段');return}let weeks=val('ruleWeeks').split(/[,，\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0&&n<=calendar().length);let r=c.rules.find(x=>x.id===modal.id);const fields={title,frequency:val('ruleFrequency'),periods,start:num(val('ruleStart'),1,30),weeks,day:val('ruleDay'),time:val('ruleTime')||'23:59'};if(r)Object.assign(r,fields);else c.rules.push({...fields,id:uid()});modal=null;save();render();toast('周期任务已更新')}
function saveTask(){let title=val('taskName').trim();if(!title){toast('任务名不能为空');return}let t=data().customTasks.find(x=>x.id===modal.id),cid=val('taskModule'),w=num(val('taskWeek'),1,calendar().length),deadline=val('taskDeadline');if(!courseInPeriod(getC(cid),cal(w)?.period)){toast('这门课程尚未启用该周所属阶段，请先到课程设置中勾选该阶段');return}if(!t){t={id:uid(),courseId:cid,week:w,title,deadline,lecture:0};data().customTasks.push(t)}else{Object.assign(t,{courseId:cid,week:w,title,deadline,lecture:0})}data().deadlines[t.id]=deadline;settingWeek=w;modal=null;save();render();toast('任务已保存')}
function downloadJSON(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`study-workspace-${Y}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function validateImport(x){if(x?.version===1&&Array.isArray(x.courses))return migrate(x);if(x?.version!==2||!x.years||typeof x.years!=='object')throw Error('无效的备份');for(const y of Object.values(x.years)){if(!Array.isArray(y.courses)||!Array.isArray(y.periods)||!Array.isArray(y.customTasks)||typeof y.completed!=='object')throw Error('无效学年数据');if(y.periods.reduce((s,p)=>s+Number(p.weeks),0)>104)throw Error('周数过多')}return x}
function addNewYear(){let latest=Object.keys(S.years).sort().at(-1);let startYear=Number(latest.slice(0,4))+1;let key=`${startYear}-${String(startYear+1).slice(-2)}`;while(S.years[key]){startYear++;key=`${startYear}-${String(startYear+1).slice(-2)}`}let from=S.years[latest];let start=addDays(from.start,from.periods.reduce((s,p)=>s+Number(p.weeks),0)*7);S.years[key]=yearMake(start);switchYear(key);V='settings';render();toast(`已创建 Academic Year ${yLabel(key)}，请设置课程`)}

async function sdk(){if(window.supabase?.createClient)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=()=>reject(Error('无法加载 Supabase SDK，请检查网络'));document.head.append(s)})}
async function connectCloud(){try{const url=val('cloudUrl').trim(),key=val('cloudKey').trim();if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(url)||!key||/service_role|sb_secret_/i.test(key))throw Error('需要正确的 Supabase URL 和 publishable/anon key，不能使用 secret key');cloudConfig={url:url.replace(/\/$/,''),key};localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudConfig));await sdk();cloud=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{user},error}=await cloud.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')throw error;cloudUser=user||null;cloudReady=false;cloudStatus=cloudUser?'已登录；请选择第一次上传或下载':'已连接云项目；请先用邮箱登录';cloud.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(!cloudUser)cloudReady=false;cloudStatus=cloudUser?'已登录；请选择同步方向':'尚未登录';render()});render();toast('云项目已连接')}catch(err){cloudStatus='云端连接失败';toast(err.message||'连接失败');render()}}
async function otp(){try{if(!cloud)await connectCloud();if(!cloud)throw Error('请先连接云项目');if(location.protocol==='file:')throw Error('邮件登录需要先把网站部署为 HTTPS 地址；本地文件模式不能完成回跳登录');const email=val('cloudEmail').trim();if(!/^\S+@\S+\.\S+$/.test(email))throw Error('请填写有效邮箱');const {error}=await cloud.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;toast('登录邮件已发送，请检查收件箱')}catch(e){toast(e.message)}}
async function uploadCloud(){if(!cloud||!cloudUser)return;try{const {error}=await cloud.from('user_state').upsert({user_id:cloudUser.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;cloudReady=true;localStorage.setItem(CLOUD_LINK_KEY,cloudUser.id);cloudStatus='云端已同步';document.querySelector('.status')&&(document.querySelector('.status').textContent='☁ 云端已同步')}catch(e){cloudReady=false;cloudStatus='云端保存失败';toast(`云端同步失败：${e.message}`);render()}}
async function downloadCloud(){if(!cloud||!cloudUser){toast('请先登录云端');return}try{const {data:row,error}=await cloud.from('user_state').select('data').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(!row){toast('云端暂无备份，可选择“本地上传到云端”');return}if(!confirm('将用云端数据替换本地所有学年和进度，建议先导出备份。继续吗？'))return;S=validateImport(row.data);Y=S.lastYear||Object.keys(S.years)[0];week=nowWeek();toPeriod(week);detailWeek=week;settingWeek=week;selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;cloudReady=true;localStorage.setItem(CLOUD_LINK_KEY,cloudUser.id);save();render();toast('已从云端恢复，后续将自动同步')}catch(e){cloudStatus='云端读取失败';toast(e.message);render()}}
async function resumeCloud(){if(!cloud||!cloudUser||localStorage.getItem(CLOUD_LINK_KEY)!==cloudUser.id)return;try{const {data:row,error}=await cloud.from('user_state').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(row&&new Date(row.updated_at).getTime()>new Date(S.updatedAt||0).getTime()+1000){S=validateImport(row.data);Y=S.lastYear&&S.years[S.lastYear]?S.lastYear:Object.keys(S.years)[0];week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;localStorage.setItem(KEY,JSON.stringify(S));cloudReady=true;cloudStatus='云端已同步';render()}else{cloudReady=true;await uploadCloud();render()}}catch(err){cloudReady=false;cloudStatus='云端恢复失败，可手动重试';render()}}
async function signOut(){if(cloud)await cloud.auth.signOut();cloudUser=null;cloudReady=false;cloudStatus='已退出云端';render()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.matches('input,select'))return;const a=el.dataset.action,id=el.dataset.id,cid=el.dataset.module;if(a==='overlay'&&e.target!==el)return;
switch(a){case'nav':V=el.dataset.view;render();window.scrollTo(0,0);break;case'module':selectedModule=id;V='modules';render();break;case'period':choosePeriod(el.dataset.period);break;case'week':switchWeek(Number(el.dataset.week));break;case'prevWeek':switchWeek(week-1);break;case'nextWeek':switchWeek(week+1);break;case'today':switchWeek(nowWeek());break;case'newYear':addNewYear();break;case'collapse':collapsed[id]=!collapsed[id];render();break;case'expandAll':collapsed={};render();break;case'collapseAll':data().courses.forEach(c=>collapsed[c.id]=true);render();break;case'detailWeek':detailWeek=Number(el.dataset.week);toPeriod(detailWeek);render();break;case'configure':settingModule=id;settingWeek=detailWeek;V='settings';render();break;case'settingModule':settingModule=id;render();break;
case'addCourse':modal={type:'course'};render();get('newCode')?.focus();break;
case'saveNewCourse':{const code=val('newCode').trim(),name=val('newName').trim();if(!code||!name){toast('请填写课程代码与名称');break}let c=courseMake(code,name,COLORS[data().courses.length%COLORS.length],['PPT','Pre-class Questions','In-class Questions'],[],[period]);data().courses.push(c);settingModule=c.id;selectedModule=c.id;modal=null;save();render();toast('新课程已创建');break}
case'deleteCourse':{let c=getC(id);if(c&&confirm(`确定删除 ${c.code} ${c.name}？这会移除全部相关打卡记录。`)){data().courses=data().courses.filter(x=>x.id!==id);data().customTasks=data().customTasks.filter(t=>t.courseId!==id);for(let k of Object.keys(data().completed))if(k.includes(':'+id+':'))delete data().completed[k];settingModule=data().courses[0]?.id||'';selectedModule=settingModule;save();render()}break}
case'saveCourse':saveCourse(id);break;case'savePlans':savePlans(id);break;case'saveDeadlines':saveDeadlines();break;
case'addTask':modal={type:'task',module:cid||settingModule,week:Number(el.dataset.week||settingWeek)};render();get('taskName')?.focus();break;
case'editTask':modal={type:'task',id};render();break;case'saveTask':saveTask();break;
case'deleteTask':if(confirm('确定删除这一项任务？')){data().customTasks=data().customTasks.filter(t=>t.id!==id);delete data().completed[id];delete data().deadlines[id];modal=null;save();render();toast('任务已删除')}break;
case'removeTask':{let c=getC(cid),t=tasks(c,settingWeek).find(t=>t.id===id);if(!t)break;if(!confirm(`从本周移除「${t.title}」？不会影响其他周。`))break;if(t.kind==='custom')data().customTasks=data().customTasks.filter(x=>x.id!==id);else data().suppressed[id]=true;delete data().completed[id];delete data().deadlines[id];save();render();break}
case'addRule':modal={type:'rule',module:cid};render();break;case'editRule':modal={type:'rule',module:cid,id};render();break;case'saveRule':saveRule();break;
case'deleteRule':if(confirm('删除周期规则后，各周对应的任务都会消失。确定吗？')){let c=getC(cid);c.rules=c.rules.filter(r=>r.id!==id);save();render()}break;
case'saveCalendar':{let start=val('yearStart');if(!/^\d{4}-\d{2}-\d{2}$/.test(start)){toast('起始日期无效');break}let lengths=[...document.querySelectorAll('[data-period-length]')];let newLen=lengths.reduce((n,x)=>n+num(x.value,1,30),0);if(newLen>104){toast('全年周数不能超过 104');break}if((start!==data().start||lengths.some(x=>num(x.value,1,30)!==perObj(x.dataset.periodLength).weeks))&&!confirm('更改起始日期或各阶段长度会调整周次日期，已有任务仍按原周号保存。确定吗？'))break;data().start=start;lengths.forEach(x=>perObj(x.dataset.periodLength).weeks=num(x.value,1,30));week=Math.min(week,calendar().length);detailWeek=Math.min(detailWeek,calendar().length);settingWeek=Math.min(settingWeek,calendar().length);toPeriod(week);save();render();toast('学年日历已更新');break}
case'export':downloadJSON();break;case'import':get('importInput').click();break;
case'reset':if(confirm('重置会清空当前浏览器的课程与打卡数据。建议先导出 JSON，确定继续吗？')){{const daily=S.daily;S=fresh();S.daily=daily;S.workspaceVersion=3;}Y='2026-27';week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);settingModule='';selectedModule='';cloudReady=false;save();render();toast('演示数据已重置')}break;
case'close':case'overlay':modal=null;render();break;
case'connectCloud':await connectCloud();break;case'otp':await otp();break;case'cloudUpload':if(confirm('上传会覆盖同账户云端保存的全部学年数据。确定上传本机数据吗？')){await uploadCloud();render()}break;case'cloudDownload':await downloadCloud();break;case'cloudSignOut':await signOut();break;
}});
get('importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{let obj=validateImport(JSON.parse(await f.text()));if(confirm('导入完整工作台备份将替换 Daily 和 Weekly；仅 Weekly 的旧备份只替换课程进度。建议先导出备份。继续吗？')){if(obj.daily)DailyCore.validate(obj.daily);else obj.daily=S.daily;obj.workspaceVersion=3;D.ensure(obj.daily);S=obj;Y=S.lastYear&&S.years[S.lastYear]?S.lastYear:Object.keys(S.years)[0];week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;save();render();toast('备份导入成功')}}catch(err){toast('导入失败：'+err.message)}e.target.value=''});
const D=DailyCore;let moduleOrdering=false,dailyDialog=null,statMonth=D.day(S.daily.timeZoneID).slice(0,7),statDay=null;
const dailyToday=()=>D.day(S.daily.timeZoneID);
function dailyDash(){const k=dailyToday(),r=D.ensure(S.daily,k),p=D.stats(r),spark=D.streak(S.daily);return `<div class="pagehead"><div><div class="eyebrow">Daily · Ember</div><h1 class="title">Daily Dashboard</h1><p class="desc">每天的小习惯，点亮今天的大火花。</p></div><div class="actions"><button class="btn" data-action="nav" data-view="habits">管理 Daily Habit</button><button class="btn primary" data-action="nav" data-view="statistics">Daily Statistics ↗</button></div></div><section class="dailyPanel panel"><div class="dailyHero"><div class="dailyRing ${p.perfect?'perfect':''}" style="--pct:${p.pct}%"><b>${p.perfect?'✓':p.pct+'%'}</b></div><h2>Today's Habits</h2><p class="muted">${k} · Europe/London</p><div class="countdown" id="dailyCountdown"></div></div><div class="dailyBanner ${p.perfect?'perfect':''}">${p.perfect?'🎉 全部完成 · Perfect Day！🔥':`${p.n} / ${p.total} 已完成 · 再完成 ${p.total-p.n} 项，点亮今天`}<span>${spark?'连续完美日 🔥 '+spark:'今天的大火花等待点亮'}</span></div><div class="dailyTasks">${r.tasks.map(t=>`<label class="dailyTask ${t.completed?'completed':''}"><input type="checkbox" data-action="dailyCheck" data-id="${esc(t.id)}" data-day="${k}" ${t.completed?'checked':''}><div><strong>${esc(t.name)}</strong><small>${esc(t.note)}</small></div><span class="dailySpark">${D.streak(S.daily,t.id)?'🔥 '+D.streak(S.daily,t.id):'○'}</span></label>`).join('')||'<div class="emptyState">还没有习惯，去 Daily Habit 添加一个吧。</div>'}</div><p class="help dailyHint">仅当天全部完成才计为 Perfect Day。Daily 火花与 Weekly 课程进度各自计算。</p></section>`}
function dailyHabits(){const k=dailyToday(),hs=D.active(S.daily,k);return `<div class="pagehead"><div><div class="eyebrow">Daily routines</div><h1 class="title">Daily Habit</h1><p class="desc">设置每天要完成的事。历史打卡按当天任务保留。</p></div><button class="btn primary" data-action="dailyAdd">＋ 添加习惯</button></div><div class="panel"><div class="habitsHead"><strong>Active habits</strong><span class="pill">${hs.length} 个每日习惯</span></div>${hs.map((h,i)=>`<div class="habitRow"><div class="habitOrder"><button class="btn tiny" aria-label="上移 ${esc(h.name)}" data-action="dailyMove" data-id="${esc(h.id)}" data-step="-1" ${i===0?'disabled':''}>↑</button><button class="btn tiny" aria-label="下移 ${esc(h.name)}" data-action="dailyMove" data-id="${esc(h.id)}" data-step="1" ${i===hs.length-1?'disabled':''}>↓</button></div><div class="habitInfo"><strong>${esc(h.name)}</strong><small>${esc(h.note)}</small><small>开始于 ${esc(h.startDay)}${h.endDay?' · 明天起停用':''}</small></div><span class="pill">🔥 ${D.streak(S.daily,h.id)}</span><button class="btn tiny" data-action="dailyEdit" data-id="${esc(h.id)}">编辑</button><button class="btn tiny danger" data-action="dailyArchive" data-id="${esc(h.id)}" ${h.endDay?'disabled':''}>停用</button></div>`).join('')||'<div class="emptyState">添加你的第一个每日习惯</div>'}<div class="notice" style="margin-top:20px">新增习惯立即计入今天；编辑名称同步到今天。停用从明天生效，已结束日期的任务与完成率保持不变。</div></div><div class="panel"><h3 class="settingsTitle">Daily 设置</h3><p class="help">每天按 Europe/London 的午夜切换，包括英国夏令时。</p><div class="actions"><button class="btn" data-action="export">导出完整工作台备份</button><button class="btn" data-action="import">导入备份</button></div><p class="help">当前数据保存在这台设备；手机与电脑的账户同步尚未接入。</p></div>`}
function dailyStats(){const k=dailyToday(),first=statMonth+'-01',date=new Date(first+'T12:00:00Z'),offset=(date.getUTCDay()+6)%7,count=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0,12)).getUTCDate();let cells='<div class="calendarBlank"></div>'.repeat(offset);for(let i=1;i<=count;i++){const key=statMonth+'-'+String(i).padStart(2,'0'),r=S.daily.days[key],p=D.stats(r),future=key>k,before=key<S.daily.firstDay;cells+=`<button class="calendarDay ${key===k?'today':''} ${p.perfect?'allDone':''} ${future||before?'untracked':''}" data-action="dailyDay" data-day="${key}" ${future||before?'disabled':''}><span>${i}</span>${future||before?'':`<b>${p.perfect?'✓':p.pct+'%'}</b><small>${p.n}/${p.total}</small>`}</button>`}const r=statDay&&S.daily.days[statDay];return `<div class="pagehead"><div><div class="eyebrow">Daily progress</div><h1 class="title">Daily Statistics</h1><p class="desc">每天的完成百分比 · 只统计 Daily Habit</p></div><div class="actions"><button class="btn" data-action="nav" data-view="daily">← Daily Dashboard</button><button class="btn" data-action="dailyMonthToday">回到本月</button></div></div><section class="panel"><div class="calendarHead"><button class="btn" data-action="dailyMonth" data-step="-1" aria-label="上个月">‹</button><h2>${statMonth}</h2><button class="btn" data-action="dailyMonth" data-step="1" aria-label="下个月">›</button></div><div class="calendarGrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="help">✓ = 当天全部完成；百分比 = 当天已完成 / 当天任务总数。未开始和未来日期不计入。</p></section>${r?`<section class="panel"><h3 class="settingsTitle">${statDay} · ${D.stats(r).pct}%</h3>${r.tasks.map(t=>`<div class="historyTask">${t.completed?'✅':'○'} ${esc(t.name)}</div>`).join('')}<p class="help">历史记录只读；今天可在 Daily Dashboard 打卡。</p></section>`:''}`}
function dailyModal(){if(!dailyDialog)return '';const h=S.daily.habits.find(h=>h.id===dailyDialog.id);return `<div class="overlay" data-action="dailyOverlay"><form class="dialog" id="dailyForm"><div class="dialogHead"><h3>${h?'编辑习惯':'添加习惯'}</h3><button type="button" class="modalClose" data-action="dailyClose" aria-label="关闭">×</button></div><div class="field" style="margin-top:18px"><label for="dailyName">习惯名称</label><input id="dailyName" maxlength="100" required value="${esc(h?.name||'')}" placeholder="例如：粤语学习"></div><div class="field" style="margin-top:12px"><label for="dailyNote">完成标准</label><textarea id="dailyNote" maxlength="500" placeholder="例如：跟读 5 分钟">${esc(h?.note||'')}</textarea></div><div class="dialogActions"><button type="button" class="btn" data-action="dailyClose">取消</button><button class="btn primary" type="submit">保存习惯</button></div></form></div>`}
function render(){const y=data();if(!y)return;if(!getC(selectedModule))selectedModule=y.courses[0]?.id||'';if(!getC(settingModule))settingModule=y.courses[0]?.id||'';if(V==='modules'&&!activeCourses().some(x=>x.id===selectedModule))selectedModule=activeCourses()[0]?.id||'';const academic=['weekly','modules','settings'].includes(V);app.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandIcon">▦</div><div><div class="brandTitle">Study Workspace</div><div class="small">Weekly + Daily · ${RELEASE.version}</div><div class="releaseTime">更新于 ${RELEASE.label}</div></div></div><div class="navGroup"><div class="navCaption">Workspace</div>${[['daily','◉','Daily Dashboard'],['habits','☷','Daily Habit'],['weekly','▦','Weekly Dashboard'],['modules','▤','Module Dashboard']].map(([v,i,t])=>`<button class="navBtn ${(V===v||v==='daily'&&V==='statistics')?'active':''}" data-action="nav" data-view="${v}"><span class="navIcon">${i}</span>${t}</button>`).join('')}</div><div class="sideModules"><div class="navCaption">Your Modules</div>${moduleNavigation()}</div><div class="sideFoot"><button class="navBtn ${V==='settings'?'active':''}" data-action="nav" data-view="settings"><span class="navIcon">⚙</span>课程与数据设置</button><p class="small" style="padding:0 12px">设备内保存 · 尚未接入云同步</p></div></aside><main class="main"><div class="mobileUtility"><button class="btn tiny" data-action="nav" data-view="settings">⚙ 课程与数据设置</button></div>${academic?`<header class="academicNav" aria-label="Academic year and term navigation">${yearStrip()}${periodTabs()}</header>`:''}${V==='weekly'?weekly():V==='daily'?dailyDash():V==='habits'?dailyHabits():V==='statistics'?dailyStats():V==='modules'?moduleDash():settings()}</main></div>${modalHTML()}${dailyModal()}`;dailyClock()}
function dailyClock(){const el=document.getElementById('dailyCountdown');if(el){const p=new Intl.DateTimeFormat('en-GB',{timeZone:S.daily.timeZoneID,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const value=k=>Number(p.find(x=>x.type===k).value);let left=86400-value('hour')*3600-value('minute')*60-value('second');el.textContent='今日剩余 '+[Math.floor(left/3600),Math.floor(left/60)%60,left%60].map(x=>String(x).padStart(2,'0')).join(':')}}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.action!=='dailyCheck')return;try{D.toggle(S.daily,el.dataset.id,el.dataset.day);save();render()}catch(err){toast(err.message);render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='dailyForm')return;e.preventDefault();const name=val('dailyName').trim(),note=val('dailyNote').trim(),k=dailyToday();if(!name)return;const h=S.daily.habits.find(h=>h.id===dailyDialog.id);if(h){h.name=name;h.note=note;const t=D.ensure(S.daily,k).tasks.find(t=>t.id===h.id);if(t){t.name=name;t.note=note}}else{const record=D.ensure(S.daily,k);const h={id:uid(),name,note,symbol:'checkmark',startDay:k,order:Math.max(0,...S.daily.habits.map(h=>h.order))+1};S.daily.habits.push(h);record.tasks.push({id:h.id,name:h.name,note:h.note,symbol:h.symbol,completed:false})}dailyDialog=null;save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dailyDialog){dailyDialog=null;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!el.dataset.action.startsWith('daily'))return;const a=el.dataset.action,id=el.dataset.id,k=dailyToday();if(a==='dailyAdd'||a==='dailyEdit'){dailyDialog={id};render();get('dailyName').focus()}else if(a==='dailyClose'||a==='dailyOverlay'&&e.target===el){dailyDialog=null;render()}else if(a==='dailyArchive'){const h=S.daily.habits.find(h=>h.id===id);if(h&&confirm('从明天起停用这个习惯？今天与历史记录会保留。')){h.endDay=k;save();render()}}else if(a==='dailyMove'){const hs=D.active(S.daily,k),i=hs.findIndex(h=>h.id===id),j=i+Number(el.dataset.step);if(hs[j]){[hs[i],hs[j]]=[hs[j],hs[i]];hs.forEach((h,i)=>h.order=i);D.ensure(S.daily,k).tasks.sort((a,b)=>hs.findIndex(h=>h.id===a.id)-hs.findIndex(h=>h.id===b.id));save();render()}}else if(a==='dailyMonth'){const d=new Date(statMonth+'-15T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+Number(el.dataset.step));statMonth=d.toISOString().slice(0,7);statDay=null;render()}else if(a==='dailyMonthToday'){statMonth=k.slice(0,7);statDay=null;render()}else if(a==='dailyDay'){statDay=el.dataset.day;render()}});
let observedDay=dailyToday();setInterval(()=>{dailyClock();const k=dailyToday();if(k!==observedDay){observedDay=k;D.ensure(S.daily,k);save();render()}},1000);

function moduleNavigation(){return activeCourses().map(c=>`<button class="courseLink ${V==='modules'&&selectedModule===c.id?'active':''}" title="${esc(c.code+' · '+c.name)}" data-action="module" data-id="${esc(c.id)}"><span class="dot" style="background:${c.color}"></span><span class="moduleNavLabel">${esc(c.code)} · ${esc(c.name)}</span></button>`).join('')}
function modulePicker(selected){const cs=activeCourses();return `<div class="modulePickerTools"><button class="btn tiny ${moduleOrdering?'primary':''}" data-action="moduleOrderToggle" aria-pressed="${moduleOrdering}">${moduleOrdering?'完成排序':'调整顺序'}</button>${moduleOrdering?'<span class="help" id="moduleSortStatus" role="status">拖动手柄调整位置，松手自动保存。</span>':''}</div><div class="modPick ${moduleOrdering?'isOrdering':''}">${cs.map(c=>`<div class="modulePickItem" data-module-id="${esc(c.id)}">${moduleOrdering?`<button class="moduleDragHandle" data-module-drag="${esc(c.id)}" aria-label="拖动 ${esc(c.code)} 排序" title="拖动排序，也可用左右方向键">⠿</button>`:''}<button class="pickBtn ${selected.id===c.id?'active':''}" data-action="module" data-id="${esc(c.id)}"><span class="dot" style="background:${c.color}"></span>${esc(c.code)} · ${esc(c.name)}</button></div>`).join('')}</div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action="moduleOrderToggle"]');if(!el)return;moduleOrdering=!moduleOrdering;render()});
function reorderModule(source,target,after){const visible=activeCourses(),from=visible.findIndex(c=>c.id===source);if(from<0||source===target||!visible.some(c=>c.id===target))return false;const [item]=visible.splice(from,1),at=visible.findIndex(c=>c.id===target)+(after?1:0);visible.splice(at,0,item);const ids=new Set(visible.map(c=>c.id));let i=0;data().courses=data().courses.map(c=>ids.has(c.id)?visible[i++]:c);save();return true}
let moduleDrag=null;
function clearModuleDrop(){document.querySelectorAll('.modulePickItem').forEach(el=>el.classList.remove('dropBefore','dropAfter','dragging'))}
function moduleDropAt(x,y){const list=document.querySelector('.modPick.isOrdering');if(!list)return null;const box=list.getBoundingClientRect();if(y<box.top-20||y>box.bottom+20||x<box.left-20||x>box.right+20)return null;const items=[...list.querySelectorAll('[data-module-id]')];let target=document.elementFromPoint(x,y)?.closest('[data-module-id]');if(!target||!list.contains(target)){target=items.sort((a,b)=>{const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();return Math.hypot(x-ar.left-ar.width/2,y-ar.top-ar.height/2)-Math.hypot(x-br.left-br.width/2,y-br.top-br.height/2)})[0]}if(!target)return null;const rect=target.getBoundingClientRect();return {id:target.dataset.moduleId,after:x>=rect.left+rect.width/2,element:target}}
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-module-drag]');if(!moduleOrdering||!handle||e.button!==0)return;moduleDrag={id:handle.dataset.moduleDrag,pointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false,drop:null};handle.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{const drag=moduleDrag;if(!drag||drag.pointer!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;drag.moved=true;e.preventDefault();clearModuleDrop();const source=document.querySelector(`[data-module-id="${drag.id}"]`);source?.classList.add('dragging');drag.drop=moduleDropAt(e.clientX,e.clientY);if(drag.drop&&drag.drop.id!==drag.id)drag.drop.element.classList.add(drag.drop.after?'dropAfter':'dropBefore')});
document.addEventListener('pointerup',e=>{const drag=moduleDrag;if(!drag||drag.pointer!==e.pointerId)return;moduleDrag=null;clearModuleDrop();if(drag.moved&&drag.drop&&reorderModule(drag.id,drag.drop.id,drag.drop.after)){render();const status=get('moduleSortStatus');if(status)status.textContent='顺序已保存；可以继续拖动。'}});
document.addEventListener('pointercancel',()=>{moduleDrag=null;clearModuleDrop()});
document.addEventListener('keydown',e=>{const handle=e.target.closest?.('[data-module-drag]');if(!moduleOrdering||!handle||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const cs=activeCourses(),i=cs.findIndex(c=>c.id===handle.dataset.moduleDrag),j=i+(e.key==='ArrowLeft'?-1:1);if(cs[j]&&reorderModule(cs[i].id,cs[j].id,j>i)){const id=handle.dataset.moduleDrag;render();document.querySelector(`[data-module-drag="${id}"]`)?.focus()}});

week=nowWeek();detailWeek=week;settingWeek=week;toPeriod(week);selectedModule=data().courses[0]?.id||'';settingModule=selectedModule;save();render();
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}
})();
</script></body></html>
