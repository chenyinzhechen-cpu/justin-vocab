ion="detailWeek" data-week="${x.week}"><span class="label">WEEK ${x.week} ${x.holiday?'☀':''}</span><div class="percent">${s.all?s.pct+'%':'—'}</div>${progress(s.pct,s.all&&s.pct===100)}<div class="count">${s.done}/${s.all} tasks</div></button>`}).join('')}</div><div class="detailHead"><h2>Week ${detailWeek} · ${esc(datestr(cal(detailWeek)?.start))} – ${esc(shortDate(cal(detailWeek)?.end))}</h2><span class="pill">${ds.done}/${ds.all} · ${ds.pct}%</span></div><section class="moduleCard"><div class="moduleBody" style="border-top:0">${taskMatrix(c,detailWeek)}</div></section>`}

function saveCourse(id){const c=getC(id);if(!c)return;const code=val('courseCode').trim(),name=val('courseName').trim();if(!code||!name){toast('请填写课程代码和名称');return}const phases=[...document.querySelectorAll('[data-course-period]:checked')].map(el=>el.dataset.coursePeriod);if(!phases.length){toast('请至少勾选一个课程所属阶段');return}const types=[...document.querySelectorAll('#defaultTaskTypes .defaultTaskRow')].map(row=>({id:row.dataset.templateId,title:row.querySelector('[data-template-name]').value.trim(),startWeek:Number(row.querySelector('[data-template-start]').value)}));if(types.some(t=>!t.title||t.title.length>120||!Number.isInteger(t.startWeek)||t.startWeek<1||t.startWeek>104)){toast('请填写任务名称，起始周需为 1–104 的整数');return}if(new Set(types.map(t=>t.title.toLowerCase())).size!==types.length){toast('默认任务名称不能重复');return}const oldTypes=new Map(c.taskTypes.map(t=>[t.id,t]));c.taskTypes=types.map(t=>({...oldTypes.get(t.id),...t}));c.activePeriods=phases;c.code=code;c.name=name;c.color=val('courseColor')||COLORS[0];save();render();toast('课程设置与每学期起始周已保存')}

function savePlans(id){const c=getC(id);if(!c)return;for(const d of calendar()){const title=document.querySelector(`[data-plan-name="${d.week}"]`)?.value.trim()||`Lecture · Week ${d.week}`;const enabled=!!document.querySelector(`[data-plan-enabled="${d.week}"]`)?.checked;c.weekPlans[d.week]={title,enabled}}save();render();toast('Lecture 名称和假期安排已保存')}

function validateImport(x){if(x?.version===1&&Array.isArray(x.courses))return migrate(x);if(x?.version!==2||!x.years||typeof x.years!=='object')throw Error('无效的备份');for(const y of Object.values(x.years)){if(!Array.isArray(y.courses)||!Array.isArray(y.periods)||!Array.isArray(y.customTasks)||typeof y.completed!=='object')throw Error('无效学年数据');if(y.periods.reduce((s,p)=>s+Number(p.weeks),0)>104)throw Error('周数过多');for(const c of y.courses){if(!Array.isArray(c.taskTypes))throw Error('课程默认任务格式无效');for(const t of c.taskTypes){if(t.startWeek!==undefined&&(!Number.isInteger(t.startWeek)||t.startWeek<1||t.startWeek>104))throw Error('默认任务起始周无效')}}}return x}

function dailyDash(){const k=dailyToday(),r=D.ensure(S.daily,k),p=D.stats(r),spark=D.streak(S.daily);return `<div class="pagehead"><div><div class="eyebrow">Daily · Ember</div><h1 class="title">Daily Routine</h1><p class="desc">每天的小习惯，点亮今天的大火花。</p></div><div class="actions"><button class="btn primary" data-action="nav" data-view="habits">管理 Daily Habit</button><button class="btn primary" data-action="nav" data-view="statistics">Daily Statistics ↗</button></div></div><section class="dailyPanel panel"><div class="dailyHero"><div class="dailyRing ${p.perfect?'perfect':''}" style="--pct:${p.pct}%"><b>${p.perfect?'✓':p.pct+'%'}</b></div><h2>Today's Habits</h2><p class="muted">${k} · Europe/London</p><div class="countdown" id="dailyCountdown"></div></div><div class="dailyBanner ${p.perfect?'perfect':''}">${p.perfect?'🎉 全部完成 · Perfect Day！🔥':`${p.n} / ${p.total} 已完成 · 再完成 ${p.total-p.n} 项，点亮今天`}<span>${spark?'连续完美日 🔥 '+spark:'今天的大火花等待点亮'}</span></div><div class="dailyTasks">${r.tasks.map(t=>`<label class="dailyTask ${t.completed?'completed':''}"><input type="checkbox" data-action="dailyCheck" data-id="${esc(t.id)}" data-day="${k}" ${t.completed?'checked':''}><div><strong>${esc(t.name)}</strong><small>${esc(t.note)}</small></div><span class="dailySpark">${D.streak(S.daily,t.id)?'🔥 '+D.streak(S.daily,t.id):'○'}</span></label>`).join('')||'<div class="emptyState">还没有习惯，去 Daily Habit 添加一个吧。</div>'}</div><p class="help dailyHint">仅当天全部完成才计为 Perfect Day。Daily 火花与 Weekly 课程进度各自计算。</p></section>`}
function dailyHabits(){const k=dailyToday(),hs=D.active(S.daily,k);return `<div class="pagehead"><div><div class="eyebrow">Daily routines</div><h1 class="title">Daily Habit</h1><p class="desc">设置每天要完成的事。历史打卡按当天任务保留。</p></div><div class="actions"><button class="btn" data-action="nav" data-view="daily">← Daily Routine</button><button class="btn primary" data-action="dailyAdd">＋ 添加习惯</button></div></div><div class="panel"><div class="habitsHead"><strong>Active habits</strong><span class="pill">${hs.length} 个每日习惯</span></div>${hs.map((h,i)=>`<div class="habitRow"><div class="habitOrder"><button class="btn tiny" aria-label="上移 ${esc(h.name)}" data-action="dailyMove" data-id="${esc(h.id)}" data-step="-1" ${i===0?'disabled':''}>↑</button><button class="btn tiny" aria-label="下移 ${esc(h.name)}" data-action="dailyMove" data-id="${esc(h.id)}" data-step="1" ${i===hs.length-1?'disabled':''}>↓</button></div><div class="habitInfo"><strong>${esc(h.name)}</strong><small>${esc(h.note)}</small><small>开始于 ${esc(h.startDay)}${h.endDay?' · 明天起停用':''}</small></div><span class="pill">🔥 ${D.streak(S.daily,h.id)}</span><button class="btn tiny" data-action="dailyEdit" data-id="${esc(h.id)}">编辑</button><button class="btn tiny danger" data-action="dailyArchive" data-id="${esc(h.id)}" ${h.endDay?'disabled':''}>停用</button></div>`).join('')||'<div class="emptyState">添加你的第一个每日习惯</div>'}<div class="notice" style="margin-top:20px">新增习惯立即计入今天；编辑名称同步到今天。停用从明天生效，已结束日期的任务与完成率保持不变。</div></div><div class="panel"><h3 class="settingsTitle">Daily 设置</h3><p class="help">每天按 Europe/London 的午夜切换，包括英国夏令时。</p><div class="actions"><button class="btn" data-action="export">导出完整工作台备份</button><button class="btn" data-action="import">导入备份</button></div><p class="help">${esc(cloudDescription())}</p></div>`}
function dailyStats(){const k=dailyToday(),first=statMonth+'-01',date=new Date(first+'T12:00:00Z'),offset=(date.getUTCDay()+6)%7,count=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0,12)).getUTCDate();let cells='<div class="calendarBlank"></div>'.repeat(offset);for(let i=1;i<=count;i++){const key=statMonth+'-'+String(i).padStart(2,'0'),r=S.daily.days[key],p=D.stats(r),future=key>k,before=key<S.daily.firstDay;cells+=`<button class="calendarDay ${key===k?'today':''} ${p.perfect?'allDone':''} ${future||before?'untracked':''}" data-action="dailyDay" data-day="${key}" ${future||before?'disabled':''}><span>${i}</span>${future||before?'':`<b>${p.perfect?'✓':p.pct+'%'}</b><small>${p.n}/${p.total}</small>`}</button>`}const r=statDay&&S.daily.days[statDay];return `<div class="pagehead"><div><div class="eyebrow">Daily progress</div><h1 class="title">Daily Statistics</h1><p class="desc">每天的完成百分比 · 只统计 Daily Habit</p></div><div class="actions"><button class="btn" data-action="nav" data-view="daily">← Daily Routine</button><button class="btn" data-action="dailyMonthToday">回到本月</button></div></div><section class="panel"><div class="calendarHead"><button class="btn" data-action="dailyMonth" data-step="-1" aria-label="上个月">‹</button><h2>${statMonth}</h2><button class="btn" data-action="dailyMonth" data-step="1" aria-label="下个月">›</button></div><div class="calendarGrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="help">✓ = 当天全部完成；百分比 = 当天已完成 / 当天任务总数。未开始和未来日期不计入。</p></section>${r?`<section class="panel"><h3 class="settingsTitle">${statDay} · ${D.stats(r).pct}%</h3>${r.tasks.map(t=>`<div class="historyTask">${t.completed?'✅':'○'} ${esc(t.name)}</div>`).join('')}<p class="help">历史记录只读；今天可在 Daily Routine 打卡。</p></section>`:''}`}

function startWorkspaceListener(){if(!AC.user||AC.choice||AC.conflict)return;AC.unsubscribe?.();const generation=AC.generation;AC.unsubscribe=AC.api.onSnapshot(workspaceRef(AC.user.uid),{includeMetadataChanges:true},snapshot=>{if(generation!==AC.generation||snapshot.metadata.fromCache||snapshot.metadata.hasPendingWrites)return;try{const remote=parseWorkspaceDoc(snapshot);if(remote)integrateWorkspaceRemote(remote);else if(AC.base){AC.conflict={paths:['云端记录已不存在'],remote:null};AC.status='云端记录已变化，需要处理';V='account';cloudRender()}}catch(e){AC.error=cloudError(e);AC.status='读取云端失败';cloudRender()}},e=>{if(generation!==AC.generation)return;AC.error=cloudError(e);AC.status='云端连接中断 · 本机保留';cloudRender()})}
function scheduleWorkspaceSync(){clearTimeout(AC.timer);if(AC.user&&AC.bound&&!AC.choice&&!AC.conflict)AC.timer=setTimeout(()=>flushWorkspace(),700)}
async function flushWorkspace(createOnly=false,replace=false){if(!AC.user||!AC.bound||AC.busy||AC.choice||AC.conflict)return;if(!navigator.onLine){AC.status='离线 · 修改已保存在本机';cloudRender();return}if(!AC.dirty&&!createOnly&&!replace){AC.status=AC.ready?'已同步':'正在读取云端…';cloudRender();return}const generation=AC.generation,uid=AC.user.uid,captured=SC.clean(S),base=SC.clone(AC.base),expectedRevision=AC.rev;AC.busy=true;AC.status='正在同步…';paintCloudStatus();try{const committed=await AC.api.runTransaction(AC.db,async tx=>{const ref=workspaceRef(uid),snapshot=await tx.get(ref),remote=parseWorkspaceDoc(snapshot);if(createOnly&&remote)throw Object.assign(Error('账号已在其他设备初始化，请重新登录读取云端。'),{code:'workspace/already-exists'});let merged;if(replace&&remote&&remote.revision!==expectedRevision)throw new SC.Conflict(['选择后云端又有新修改']);if(replace)merged=captured;else if(remote)merged=SC.merge(base,captured,SC.clean(remote.state));else if(base!==null)throw new SC.Conflict(['云端记录已不存在']);else merged=captured;const payload=JSON.stringify(merged);if(new TextEncoder().encode(payload).length>850000)throw Error('工作台数据较大，请先导出备份；当前云端版本支持约 850 KB 的记录。');const revision=(remote?.revision||0)+1;tx.set(ref,{schema:1,ownerUid:uid,revision,payload,updatedAt:AC.api.serverTimestamp()});return {state:merged,revision}},{maxAttempts:5});if(generation!==AC.generation)return;const current=SC.clean(S),merged=SC.merge(captured,current,committed.state);AC.base=committed.state;AC.rev=committed.revision;adoptWorkspace(merged);AC.dirty=!SC.eq(SC.clean(S),AC.base);AC.ready=true;AC.error='';AC.lastSync=new Date().toISOString();AC.status=AC.dirty?'有修改 · 等待同步':'已同步';persistWorkspace();}catch(e){if(generation!==AC.generation)return;if(e.name==='SyncConflict'){AC.conflict={paths:e.paths,remote:null};backupWorkspace(S,'同步冲突前的本机工作台');AC.status='有同时修改，需要处理';V='account'}else{AC.error=cloudError(e);AC.status='未同步 · 本机已保留';}}finally{if(generation===AC.generation){AC.busy=false;const latest=AC.latest;AC.latest=null;if(latest&&!AC.confl async function chooseCloudWorkspace(useLocal){if(!AC.choice||!AC.user)return;const choice=AC.choice;if(useLocal&&!confirm('上传会替换这个账号现有的云端工作台。两份数据都会先保留本机备份。继续吗？'))return;backupWorkspace(S,'首次同步选择前的本机工作台');backupWorkspace(choice.remote.state,'首次同步前的云端工作台');AC.bound=true;AC.base=SC.clean(choice.remote.state);AC.rev=choice.remote.revision;AC.choice=null;if(useLocal){AC.dirty=true;persistWorkspace();await flushWorkspace(false,true)}else{adoptWorkspace(choice.remote.state);AC.dirty=false;AC.ready=true;AC.status='已同步';AC.lastSync=new Date().toISOString();persistWorkspace()}startWorkspaceListener();render()}
async function resolveCloudConflict(useLocal){if(!AC.user)return;if(!confirm(useLocal?'保留本机版本并替换云端？将先保存两份备份。':'使用云端版本？本机版本将先保存为备份。'))return;try{const remote=parseWorkspaceDoc(await AC.api.getDocFromServer(workspaceRef(AC.user.uid)));backupWorkspace(S,'解决冲突前的本机版本');if(remote)backupWorkspace(remote.state,'解决冲突前的云端版本');AC.conflict=null;AC.base=remote?SC.clean(remote.state):null;AC.rev=remote?.revision||0;if(useLocal){AC.dirty=true;await flushWorkspace(!remote,true)}else if(remote){adoptWorkspace(remote.state);AC.dirty=false;AC.ready=true;AC.status='已同步';persistWorkspace()}else throw Error('云端记录已不存在，可以选择保留本机版本。');startWorkspaceListener();render()}catch(e){AC.error=cloudError(e);render()}}
document.addEventListener('submit',async e=>{if(e.target.id!=='workspaceAuthForm')return;e.preventDefault();if(AC.loading)return;const email=val('accountEmail').trim(),password=val('accountPassword');if(AC.mode==='register'&&password!==val('accountConfirm')){AC.error='两次输入的密码不一致。';render();return}AC.loading=true;AC.error='';try{const api=await workspaceSDK();if(AC.mode==='register')await api.createUserWithEmailAndPassword(AC.auth,email,password);else await api.signInWithEmailAndPassword(AC.auth,email,password)}catch(err){AC.error=cloudError(err);AC.loading=false;render()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||!el.dataset.action.startsWith('account'))return;const action=el.dataset.action;try{if(action==='accountMode'){AC.mode=AC.mode==='login'?'register':'login';AC.error='';render()}else if(action==='accountLogout'){if(AC.dirty&&!confirm('还有本机修改未上传，退出后仍会保留在这个账号的本机缓存中。确定退出吗？'))return;await AC.api.signOut(AC.auth)}else if(action==='accountSync'){AC.error='';if(!AC.bound)await workspaceAuthChanged(AC.user);else{await flushWorkspace();if(!AC.dirty&&!AC.conflict){const remote=parseWorkspaceDoc(await AC.api.getDocFromServer(workspaceRef(AC.user.uid)));if(remote)integrateWorkspaceRemote(remote)}}}else if(action==='accountUseCloud')await chooseCloudWorkspace(false);else if(action==='accountUseLocal')await chooseCloudWorkspace(true);else if(action==='accountConflictLocal')await resolveCloudConflict(true);else if(action==='accountConflictRemote')await resolveCloudConflict(false);else if(action==='accountReset'){const email=val('accountEmail').trim();if(!/^\S+@\S+\.\S+$/.test(email))throw Error('请先输入注册邮箱。');const api=await workspaceSDK();await api.sendPasswordResetEmail(AC.auth,email);toast('若邮箱存在，重置密码邮件将发送到该邮箱。')}else if(action==='accountBackupDownload'){const backups=JSON.parse(localStorage.getItem('study-workspace-backups-v1:'+(AC.user?.uid||'guest'))||'[]');if(!backups.length)throw Error('这台设备还没有迁移备份。');const blob=new Blob([JSON.stringify(backups[0].state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='study-workspace-migration-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}}catch(err){AC.error=cloudError(err);render()}});
